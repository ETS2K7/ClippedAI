## Rate limiting zones (defined at http context — adjust burst as needed)
# NOTE: These limit_req_zone directives must be placed in the nginx http {} context,
#       not inside a server {} block. Add them to /etc/nginx/nginx.conf or a
#       conf.d/limits.conf file that is included in the http {} block.
#
#   limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
#   limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=100r/m;

server {
    listen 80;
    server_name clippedai.app www.clippedai.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name clippedai.app www.clippedai.app;

    ssl_certificate     /etc/letsencrypt/live/clippedai.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clippedai.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Content-Security-Policy — adjust sources as needed for your CDN/analytics
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none';" always;

    # Allow large video uploads (up to 500MB)
    client_max_body_size 500M;
    client_body_timeout  300s;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate-limit auth endpoints (brute-force protection)
    location ~ ^/api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Rate-limit general API calls
    location ~ ^/api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSE / long-polling support (progress streaming)
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_buffering       off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
