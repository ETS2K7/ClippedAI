# Rate limiting shared memory zones — must live in nginx http{} context.
# Included from /etc/nginx/conf.d/ which is loaded before sites-enabled in nginx.conf.
#
# auth_limit  : 20 req/min per IP  → protects login/register endpoints
# api_limit   : 100 req/min per IP → general API rate cap
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=100r/m;
limit_req_zone $binary_remote_addr zone=feedback_limit:10m rate=5r/m;
