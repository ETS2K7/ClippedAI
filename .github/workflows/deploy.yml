name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "${{ secrets.OCI_SERVER_IP }}" >> ~/.ssh/known_hosts

      # ── Write .env.production locally ──────────────────────────────────
      - name: Write .env.production
        run: |
          cat > /tmp/env.production << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          NEXTAUTH_URL=https://clippedai.app
          AUTH_TRUST_HOST=true
          BASE_URL=https://clippedai.app
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
          PROCESS_VIDEO_ENDPOINT=${{ secrets.PROCESS_VIDEO_ENDPOINT }}
          PROCESS_VIDEO_ENDPOINT_AUTH=${{ secrets.PROCESS_VIDEO_ENDPOINT_AUTH }}
          NEXT_PUBLIC_CLOUDFRONT_DOMAIN=${{ secrets.NEXT_PUBLIC_CLOUDFRONT_DOMAIN }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SMALL_CREDIT_PACK=${{ secrets.STRIPE_SMALL_CREDIT_PACK }}
          STRIPE_MEDIUM_CREDIT_PACK=${{ secrets.STRIPE_MEDIUM_CREDIT_PACK }}
          STRIPE_LARGE_CREDIT_PACK=${{ secrets.STRIPE_LARGE_CREDIT_PACK }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          EOF
          # Strip leading whitespace from heredoc
          sed -i 's/^[[:space:]]*//' /tmp/env.production

          cat > /tmp/root.env << EOF
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/root.env

          echo "✓ Environments written"

      # ── Rsync checked-out code to server (excludes .env* so it's safe) ─
      - name: Sync code to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='frontend/.next' \
            --exclude='frontend/node_modules' \
            --exclude='frontend/.env*' \
            --exclude='.env*' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ubuntu@${{ secrets.OCI_SERVER_IP }}:/opt/clippedai/

      # ── Upload .env.production and root .env AFTER rsync so they're never deleted ───────
      - name: Upload env files to server
        run: |
          scp -i ~/.ssh/deploy_key \
            /tmp/env.production \
            ubuntu@${{ secrets.OCI_SERVER_IP }}:/opt/clippedai/frontend/.env.production
          scp -i ~/.ssh/deploy_key \
            /tmp/root.env \
            ubuntu@${{ secrets.OCI_SERVER_IP }}:/opt/clippedai/.env

      # ── Rebuild on server ────────────────────────────────────────────────
      - name: Write server deploy script
        run: |
          cat > /tmp/server-deploy.sh << 'SCRIPTEOF'
          #!/bin/bash
          set -euo pipefail
          cd /opt/clippedai

          echo "==> Starting database..."
          docker compose up -d db
          for i in $(seq 1 12); do
            if docker compose exec -T db pg_isready -U postgres > /dev/null 2>&1; then
              echo "✓ Database ready"; break
            fi
            [ "$i" -eq 12 ] && echo "✗ DB timeout" && docker compose logs db --tail=20 && exit 1
            echo "  Waiting for DB ($((i*5))s)..."; sleep 5
          done

          echo "==> Building app image (no cache to pick up new Prisma engines)..."
          docker compose build --no-cache app

          echo "==> Starting app..."
          docker compose up -d app

          echo "==> Applying database schema updates..."
          docker compose exec -T app npx prisma db push --accept-data-loss

          echo "==> Waiting for app health (Docker healthcheck)..."
          for i in $(seq 1 24); do
            H=$(docker inspect --format='{{.State.Health.Status}}' clippedai-app-1 2>/dev/null || echo 'missing')
            echo "  attempt $i/24: $H"
            [ "$H" = "healthy" ] && echo "✓ App is healthy!" && break
            [ "$i" -eq 24 ] && echo "✗ Health check timeout" && docker compose logs app --tail=50 && exit 1
            sleep 15
          done

          echo "==> Deploy complete!"
          docker compose ps

          # Ensure rate-limit zones (http-context) are always installed in conf.d
          sudo cp /opt/clippedai/nginx/conf.d/rate-limits.conf /etc/nginx/conf.d/rate-limits.conf
          if ! diff -q /opt/clippedai/nginx/clippedai.conf /etc/nginx/sites-available/clippedai > /dev/null 2>&1; then
            echo "==> Syncing nginx site config..."
            sudo cp /opt/clippedai/nginx/clippedai.conf /etc/nginx/sites-available/clippedai
          fi
          sudo nginx -t && sudo systemctl reload nginx && echo "✓ Nginx config applied"
          SCRIPTEOF
          sed -i 's/^          //' /tmp/server-deploy.sh
          chmod +x /tmp/server-deploy.sh
          echo "✓ Deploy script written"

      - name: Deploy on server
        run: |
          scp -i ~/.ssh/deploy_key \
            /tmp/server-deploy.sh \
            ubuntu@${{ secrets.OCI_SERVER_IP }}:/tmp/server-deploy.sh
          ssh -i ~/.ssh/deploy_key \
            ubuntu@${{ secrets.OCI_SERVER_IP }} \
            "bash /tmp/server-deploy.sh"

      - name: Verify deployment
        run: |
          echo "==> Verifying app health directly on server (bypasses Cloudflare bot protection)..."
          for i in $(seq 1 12); do
            HEALTH=$(ssh -i ~/.ssh/deploy_key \
              ubuntu@${{ secrets.OCI_SERVER_IP }} \
              "curl -sf http://localhost:3000/api/health 2>/dev/null || echo unreachable" 2>/dev/null || echo unreachable)
            if echo "$HEALTH" | grep -q '"status":"ok"'; then
              echo "✅ App is healthy: $HEALTH"
              echo "🌐 Live at: https://clippedai.app"
              exit 0
            fi
            echo "  Attempt $i/12 — response: $HEALTH — waiting 15s..."
            sleep 15
          done
          echo "✗ Health check timed out"
          ssh -i ~/.ssh/deploy_key \
            ubuntu@${{ secrets.OCI_SERVER_IP }} \
            "cd /opt/clippedai && docker compose logs app --tail=30" || true
          exit 1
