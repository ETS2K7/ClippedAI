name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Non-fatal: fresh servers may not respond to keyscan immediately
          ssh-keyscan -T 10 -H "${{ secrets.OCI_SERVER_IP }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config
          echo "LogLevel ERROR" >> ~/.ssh/config

      # ── Write .env.production locally ──────────────────────────────────
      - name: Write .env.production
        run: |
          cat > /tmp/env.production << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          NEXTAUTH_URL=https://clippedai.app
          AUTH_TRUST_HOST=true
          BASE_URL=https://clippedai.app
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
          PROCESS_VIDEO_ENDPOINT=${{ secrets.PROCESS_VIDEO_ENDPOINT }}
          PROCESS_VIDEO_ENDPOINT_AUTH=${{ secrets.PROCESS_VIDEO_ENDPOINT_AUTH }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SMALL_CREDIT_PACK=${{ secrets.STRIPE_SMALL_CREDIT_PACK }}
          STRIPE_MEDIUM_CREDIT_PACK=${{ secrets.STRIPE_MEDIUM_CREDIT_PACK }}
          STRIPE_LARGE_CREDIT_PACK=${{ secrets.STRIPE_LARGE_CREDIT_PACK }}
          EOF
          # Strip leading whitespace from heredoc
          sed -i 's/^[[:space:]]*//' /tmp/env.production
          echo "✓ .env.production written"

      # ── Rsync checked-out code to server (excludes .env* so it's safe) ─
      - name: Sync code to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='frontend/.next' \
            --exclude='frontend/node_modules' \
            --exclude='frontend/.env*' \
            --exclude='.env*' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ubuntu@${{ secrets.OCI_SERVER_IP }}:/opt/clippedai/

      # ── Upload .env.production AFTER rsync so it's never deleted ───────
      - name: Upload .env.production to server
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/env.production \
            ubuntu@${{ secrets.OCI_SERVER_IP }}:/opt/clippedai/frontend/.env.production

      # ── Rebuild on server ────────────────────────────────────────────────
      - name: Write server deploy script
        run: |
          cat > /tmp/server-deploy.sh << 'SCRIPTEOF'
          #!/bin/bash
          set -euo pipefail
          cd /opt/clippedai

          echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" > .env

          echo "==> Starting database..."
          docker compose up -d db
          for i in $(seq 1 12); do
            if docker compose exec -T db pg_isready -U postgres > /dev/null 2>&1; then
              echo "✓ Database ready"; break
            fi
            [ "$i" -eq 12 ] && echo "✗ DB timeout" && docker compose logs db --tail=20 && exit 1
            echo "  Waiting for DB ($((i*5))s)..."; sleep 5
          done

          echo "==> Building app image..."
          docker compose build app

          echo "==> Starting app..."
          docker compose up -d app

          echo "==> Waiting for app health (Docker healthcheck)..."
          for i in $(seq 1 24); do
            H=$(docker inspect --format='{{.State.Health.Status}}' clippedai-app-1 2>/dev/null || echo 'missing')
            echo "  attempt $i/24: $H"
            [ "$H" = "healthy" ] && echo "✓ App is healthy!" && break
            [ "$i" -eq 24 ] && echo "✗ Health check timeout" && docker compose logs app --tail=50 && exit 1
            sleep 15
          done

          echo "==> Deploy complete!"
          docker compose ps

          if ! diff -q /opt/clippedai/nginx/clippedai.conf /etc/nginx/sites-available/clippedai > /dev/null 2>&1; then
            echo "==> Syncing nginx config..."
            sudo cp /opt/clippedai/nginx/clippedai.conf /etc/nginx/sites-available/clippedai
            sudo nginx -t && sudo systemctl reload nginx && echo "✓ Nginx reloaded"
          fi
          SCRIPTEOF
          sed -i 's/^          //' /tmp/server-deploy.sh
          chmod +x /tmp/server-deploy.sh
          echo "✓ Deploy script written"

      - name: Deploy on server
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/server-deploy.sh \
            ubuntu@${{ secrets.OCI_SERVER_IP }}:/tmp/server-deploy.sh
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.OCI_SERVER_IP }} \
            "POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' bash /tmp/server-deploy.sh"

      - name: Verify deployment
        run: |
          echo "==> Polling https://clippedai.app/api/health (up to 5 minutes)..."
          for i in $(seq 1 30); do
            if curl -sf https://clippedai.app/api/health | grep -q '"status":"ok"'; then
              echo "✅ https://clippedai.app is live!"
              exit 0
            fi
            echo "  Attempt $i/30 — waiting 10s..."
            sleep 10
          done
          echo "⚠️  Health check timed out after 5 minutes"
          exit 1
