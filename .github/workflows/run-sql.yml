name: Run SQL Migration
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH agent
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "${{ secrets.DO_SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Run SQL on server
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DO_SERVER_IP }} << 'EOF'
          cd /opt/clippedai
          docker compose exec -T db psql -U postgres -d clippedai -c "
            UPDATE \"User\" SET \"fontSize\" = 75 WHERE \"fontSize\" IS NOT NULL AND \"fontSize\" < 50;
            SELECT email, \"fontSize\" FROM \"User\" WHERE \"fontSize\" IS NOT NULL;
          "
          EOF
